<div class="mt-3 mb-1 pl-7">
    <div class="flex flex-col justify-center flex-wrap">
        <span class="text-gray-900 dark:text-gray-100 font-bold text-lg my-0">Menú Principal</span>
        <p class="text-xs text-gray-500 dark:text-gray-400 font-medium pt-1">Procesar Pagos</p>
    </div>
</div>

<div class="w-full px-4 mx-auto pt-3">
    <div class="flex justify-left mb-2">
        <div class="w-full md:w-10/12 xxl:w-8/12">
            <div class="border border-gray-300 rounded-lg shadow-sm mb-2 bg-white">
                <div class="p-3 text-center">
                    <label class="text-xs font-medium text-gray-700 text-orange-500">
                        Procesar Pago: <label class="text-gray-500">Realiza el Pago de PagoLink o ventas IziPay de la web.</label>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="flex justify-left mb-4">
        <div class="w-full xl:w-8/12 lg:w-10/12">
            <div class="flex flex-wrap items-center">
                <div class="w-2/12 flex justify-center items-center text-sm font-medium text-gray-800">Nro Operacion:</div>
                <div class="w-4/12 mr-4">
                    <input type="text" id="inputPagarPasaje" (keyup.enter)="PagarPasaje()" class="form-input w-full uppercase border border-gray-300 rounded px-2 py-1" />
                </div>
                <div class="w-5/12 flex items-center justify-start">
                    <button class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded mr-2" (click)="PagarPasaje()">Simular Pago</button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex justify-left mt-10" *ngIf="PagoRealizado == 1">
        <div class="w-full xl:w-8/12 lg:w-10/12">
            <div class="w-3/4 relative mx-auto text-center text-gray-500 mt-[10%]">
                {{mensajeSimulacionPago}} <br>
            </div>
        </div>
    </div>

    <div class="flex justify-left mt-10" *ngIf="PagoRealizado == 2">
        <div class="w-full xl:w-8/12 lg:w-10/12">
            <div class="w-3/4 relative mx-auto text-center text-gray-500 mt-[10%]">
                {{mensajeSimulacionPago}} <br>
            </div>
        </div>
    </div>
</div>
